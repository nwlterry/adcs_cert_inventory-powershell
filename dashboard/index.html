<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CA Ledger</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121410;
      --surface: #1c1f18;
      --fg: #ebe8dc;
      --muted: #a8ad9c;
      --brass: #e0b15a;
      --brass-fg: #1c1408;
      --danger: #ef6a4a;
      --border: #34392e;
      --sans: "Segoe UI", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --mono: "Cascadia Mono", "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
    body { min-height: 100vh; }
    button, [role="button"] { cursor: pointer; font: inherit; color: inherit; }
    button { background: none; border: 0; }
    main { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: flex; flex-direction: column; gap: 1.25rem; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em; }
    h2 { margin: 0; font-size: 1rem; font-weight: 500; overflow-wrap: anywhere; }
    p { margin: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; align-items: flex-start; }
    .brand { display: flex; gap: 0.75rem; align-items: flex-start; }
    .mark { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; background: var(--brass); color: var(--brass-fg); font-family: var(--mono); font-size: 0.85rem; border-radius: 0.375rem; flex: none; }
    .muted { color: var(--muted); }
    .small { font-size: 0.875rem; }
    .tiny { font-size: 0.75rem; }
    .mono { font-family: var(--mono); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .btn { height: 2.75rem; padding: 0 0.75rem; border-radius: 0.375rem; border: 1px solid var(--border); background: var(--surface); font-size: 0.875rem; }
    .btn.brass { background: var(--brass); color: var(--brass-fg); border-color: transparent; font-weight: 500; }
    .btn.on { background: var(--brass); color: var(--brass-fg); border-color: transparent; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.375rem; }
    .banner { padding: 0.75rem; }
    .hierarchy { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 0.375rem; overflow: hidden; }
    @media (min-width: 640px) { .hierarchy { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .cell { background: var(--surface); padding: 0.75rem; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
    @media (min-width: 960px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .stat { padding: 0.75rem; }
    .stat b { display: block; margin-top: 0.25rem; font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .stat b.warn { color: var(--danger); }
    .stat b.ok { color: var(--brass); }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; border-bottom: 1px solid var(--border); }
    .tab { height: 2.75rem; padding: 0 0.75rem; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab.on { color: var(--fg); border-bottom-color: var(--brass); }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    input[type="search"] { height: 2.75rem; flex: 1; min-width: 12rem; border-radius: 0.375rem; border: 1px solid var(--border); background: var(--bg); color: var(--fg); padding: 0 0.75rem; font: inherit; }
    .group { overflow: hidden; }
    .group header, .client { padding: 0.75rem; }
    .group header { border-bottom: 1px solid var(--border); }
    .client { display: grid; gap: 0.25rem; border-bottom: 1px solid var(--border); }
    .client:last-child { border-bottom: 0; }
    @media (min-width: 640px) {
      .client { grid-template-columns: minmax(0, 1.4fr) 4rem minmax(0, 1fr); align-items: center; }
    }
    .break { overflow-wrap: anywhere; }
    .active { color: var(--brass); font-weight: 500; }
    .bad { color: var(--danger); font-weight: 500; }
    .stack { display: flex; flex-direction: column; gap: 0.75rem; }
    .alert { color: var(--danger); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const STATUS_WINDOW_FALLBACK_MS = 5 * 60 * 1000;
    const LABELS = {
      active: "Active",
      inactive: "Inactive",
      "not-in-dns": "Not in DNS",
      "not-on-network": "Not on network",
      "not-checked": "Not checked"
    };
    const FILTERS = ["all", "active", "inactive", "not-in-dns", "not-on-network"];

    function iso(days) {
      return new Date(Date.now() + days * 86400000).toISOString();
    }
    function sample() {
      const now = new Date().toISOString();
      const stale = new Date(Date.now() - 20 * 60 * 1000).toISOString();
      return {
        schema: "ca-ledger/1",
        collectedAt: now,
        collector: "on-prem sample",
        rootName: "CORP-OFFLINE-ROOT-CA",
        expiryWindowDays: 30,
        statusWindowMinutes: 5,
        issuing: [
          { config: "pki-ica01.corp.local\\CORP-ISSUING-CA-01", host: "pki-ica01.corp.local", name: "CORP-ISSUING-CA-01" },
          { config: "pki-ica02.corp.local\\CORP-ISSUING-CA-02", host: "pki-ica02.corp.local", name: "CORP-ISSUING-CA-02" }
        ],
        certificates: [
          cert("c1", "4f12a1000001", "CORP-ISSUING-CA-01", "pki-ica01.corp.local", "es-data-01.obs.corp.local", "Machine", iso(-400), iso(200), [
            ["dns", "es-data-01.obs.corp.local"], ["ip", "10.16.8.21"]
          ]),
          cert("c2", "11aa01000001", "CORP-ISSUING-CA-01", "pki-ica01.corp.local", "web-iis-01.corp.local", "WebServer", iso(-320), iso(18), [
            ["dns", "web-iis-01.corp.local"], ["dns", "www.corp.local"], ["ip", "10.16.2.31"]
          ]),
          cert("c3", "11aa01000002", "CORP-ISSUING-CA-01", "pki-ica01.corp.local", "web-iis-01.corp.local", "WebServer", iso(-20), iso(340), [
            ["dns", "web-iis-01.corp.local"], ["dns", "www.corp.local"], ["ip", "10.16.2.31"]
          ]),
          cert("c4", "d10100000001", "CORP-ISSUING-CA-02", "pki-ica02.corp.local", "ocp-api.ocp.corp.local", "WebServer", iso(-200), iso(3), [
            ["dns", "ocp-api.ocp.corp.local"], ["ip", "10.16.12.10"]
          ]),
          cert("c5", "aa0100000007", "CORP-ISSUING-CA-02", "pki-ica02.corp.local", "missing.corp.local", "Machine", iso(-10), iso(80), [
            ["dns", "missing.corp.local"]
          ])
        ],
        clientChecks: [
          check("c1", "4f12a1000001", "es-data-01.obs.corp.local", "cn", "active", now, "10.16.8.21"),
          check("c1", "4f12a1000001", "10.16.8.21", "san", "active", now, "10.16.8.21"),
          check("c2", "11aa01000001", "web-iis-01.corp.local", "cn", "inactive", now, "10.16.2.31"),
          check("c2", "11aa01000001", "www.corp.local", "san", "active", now, "10.16.2.31"),
          check("c2", "11aa01000001", "10.16.2.31", "san", "active", now, "10.16.2.31"),
          check("c3", "11aa01000002", "web-iis-01.corp.local", "cn", "active", now, "10.16.2.31"),
          check("c3", "11aa01000002", "www.corp.local", "san", "active", now, "10.16.2.31"),
          check("c3", "11aa01000002", "10.16.2.31", "san", "active", now, "10.16.2.31"),
          check("c4", "d10100000001", "ocp-api.ocp.corp.local", "cn", "not-on-network", now, "10.16.12.10"),
          check("c4", "d10100000001", "10.16.12.10", "san", "not-on-network", now, "10.16.12.10"),
          check("c5", "aa0100000007", "missing.corp.local", "cn", "not-in-dns", stale, null)
        ],
        errors: []
      };
    }
    function cert(id, serial, issuer, host, cn, template, notBefore, notAfter, sans) {
      return {
        id, requestId: 0, serial, issuerConfig: host + "\\" + issuer, issuerName: issuer, issuerHost: host,
        cn, subject: "CN=" + cn, sans: sans.map(function (pair) { return { type: pair[0], value: pair[1] }; }),
        template, requester: "", notBefore, notAfter, disposition: "issued", resolved: []
      };
    }
    function check(certId, serial, client, via, status, checkedAt, address) {
      return { certId, serial, client, via, status, checkedAt, address };
    }

    const state = {
      snapshot: null,
      source: "sample",
      tab: "clients",
      filter: "all",
      query: "",
      error: ""
    };

    function el(tag, attrs) {
      const node = document.createElement(tag);
      const props = attrs || {};
      Object.keys(props).forEach(function (key) {
        const value = props[key];
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value == null ? "" : String(value);
        else if (typeof value === "function") node.addEventListener(key, value);
        else if (value != null && value !== false) node.setAttribute(key, value === true ? "" : String(value));
      });
      for (let i = 2; i < arguments.length; i++) {
        const child = arguments[i];
        if (child == null || child === false) continue;
        node.append(child);
      }
      return node;
    }

    function normalizeSerial(serial) {
      const hex = String(serial || "").replace(/[^0-9a-fA-F]/g, "").toLowerCase().replace(/^0+/, "");
      return hex || "0";
    }
    function formatSerial(serial) {
      return normalizeSerial(serial).toUpperCase().replace(/(.{2})(?=.)/g, "$1 ").trim();
    }
    function formatWhen(isoText) {
      const date = new Date(isoText);
      if (Number.isNaN(date.getTime())) return String(isoText || "");
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return date.getDate() + " " + months[date.getMonth()] + " " + date.getFullYear();
    }
    function shortCa(name) {
      const tail = String(name || "").match(/(CA[-_]?\d+)$/i);
      return tail ? tail[1].replace("_", "-").toUpperCase() : String(name || "");
    }
    function isValid(cert, now) {
      if (!cert || cert.disposition !== "issued") return false;
      const t = now.getTime();
      return new Date(cert.notBefore).getTime() <= t && new Date(cert.notAfter).getTime() > t;
    }
    function daysUntil(isoText, now) {
      return Math.ceil((new Date(isoText).getTime() - now.getTime()) / 86400000);
    }
    function clientsOnCert(cert) {
      const rows = [];
      const seen = {};
      const cn = String(cert.cn || "").trim();
      if (cn) {
        rows.push({ client: cn, via: "cn" });
        seen[cn.toLowerCase()] = true;
      }
      (cert.sans || []).forEach(function (san) {
        if (san.type !== "dns" && san.type !== "ip") return;
        const value = String(san.value || "").trim();
        if (!value || seen[value.toLowerCase()]) return;
        seen[value.toLowerCase()] = true;
        rows.push({ client: value, via: "san" });
      });
      return rows;
    }
    function buildRows(snapshot, now) {
      const checks = snapshot.clientChecks || [];
      const byKey = {};
      checks.forEach(function (checkRow) {
        byKey[checkRow.certId + "|" + String(checkRow.client).toLowerCase() + "|" + checkRow.via] = checkRow;
        byKey[normalizeSerial(checkRow.serial) + "|" + String(checkRow.client).toLowerCase() + "|" + checkRow.via] = checkRow;
      });
      const windowMs = (snapshot.statusWindowMinutes || 5) * 60 * 1000 || STATUS_WINDOW_FALLBACK_MS;
      const rows = [];
      (snapshot.certificates || []).filter(function (cert) { return isValid(cert, now); })
        .sort(function (a, b) { return new Date(a.notAfter) - new Date(b.notAfter) || String(a.cn).localeCompare(String(b.cn)); })
        .forEach(function (cert) {
          clientsOnCert(cert).forEach(function (item) {
            const found = byKey[cert.id + "|" + item.client.toLowerCase() + "|" + item.via]
              || byKey[normalizeSerial(cert.serial) + "|" + item.client.toLowerCase() + "|" + item.via];
            const checkedAt = found && found.checkedAt ? found.checkedAt : null;
            const age = checkedAt ? now.getTime() - new Date(checkedAt).getTime() : Infinity;
            rows.push({
              cert: cert,
              client: item.client,
              via: item.via,
              status: found ? found.status : "not-checked",
              checkedAt: checkedAt,
              address: found ? found.address : null,
              fresh: age <= windowMs
            });
          });
        });
      return rows;
    }

    function accept(data, source) {
      if (!data || data.schema !== "ca-ledger/1" || !Array.isArray(data.certificates)) {
        state.error = "That file is not a ca-ledger/1 inventory.";
        render();
        return;
      }
      state.snapshot = data;
      state.source = source;
      state.error = "";
      render();
    }

    async function loadFile() {
      const focused = document.activeElement;
      const wasSearch = focused && focused.matches && focused.matches('input[type="search"]');
      const caret = wasSearch ? focused.selectionStart : null;
      try {
        const response = await fetch("cert-inventory.json", { cache: "no-store" });
        if (!response.ok) throw new Error("missing");
        const data = await response.json();
        if (state.source === "collector" && state.snapshot && JSON.stringify(state.snapshot) === JSON.stringify(data)) return;
        accept(data, "collector");
      } catch (err) {
        if (!state.snapshot) accept(sample(), "sample");
      }
      if (wasSearch) {
        const next = document.querySelector('input[type="search"]');
        if (next) {
          next.focus();
          if (caret != null) next.setSelectionRange(caret, caret);
        }
      }
    }

    function onPick(event) {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        try { accept(JSON.parse(String(reader.result || "")), "import"); }
        catch (err) { state.error = "That file is not valid JSON from the collector."; render(); }
      };
      reader.readAsText(file);
    }

    function render() {
      const now = new Date();
      const snap = state.snapshot || sample();
      const certs = snap.certificates || [];
      const windowDays = snap.expiryWindowDays || 30;
      const windowMinutes = snap.statusWindowMinutes || 5;
      const rows = buildRows(snap, now);
      const valid = certs.filter(function (cert) { return isValid(cert, now); });
      const expiring = valid.filter(function (cert) { return daysUntil(cert.notAfter, now) <= windowDays; })
        .sort(function (a, b) { return new Date(a.notAfter) - new Date(b.notAfter); });
      const quiet = rows.filter(function (row) { return row.status !== "active"; }).length;
      const root = document.getElementById("app");
      root.replaceChildren();

      const file = el("input", { class: "sr", type: "file", accept: "application/json,.json", change: onPick });
      const where = location.protocol === "file:" ? "Opened from disk" : "Hosted at " + location.host;
      root.append(el("header", { class: "row" },
        el("div", { class: "brand" },
          el("span", { class: "mark", text: "CA" }),
          el("div", {},
            el("h1", { text: "CA Ledger" }),
            el("p", { class: "small muted", text: "On-prem console. Issued certificates are the base. Each CN and SAN is a client of that serial. This page only reads the inventory on this host." }),
            el("p", { class: "tiny muted", text: (state.source === "collector" ? "Live collection" : state.source === "import" ? "Imported collection" : "Sample estate") + " · " + formatWhen(snap.collectedAt) + " · " + (snap.rootName || "") + " · " + where })
          )
        ),
        el("div", { class: "actions" },
          el("button", { class: "btn", type: "button", text: "Load sample", click: function () { accept(sample(), "sample"); } }),
          el("button", { class: "btn brass", type: "button", text: "Import JSON", click: function () { file.click(); } }),
          file
        )
      ));

      if (state.error) root.append(el("p", { class: "card banner small alert", role: "alert", text: state.error }));
      (snap.errors || []).forEach(function (item) {
        root.append(el("p", { class: "card banner small alert", text: (item.config ? item.config + ": " : "") + item.message }));
      });

      const hierarchy = el("section", { class: "hierarchy" });
      hierarchy.append(el("div", { class: "cell" },
        el("p", { class: "tiny muted", text: "Offline root" }),
        el("p", { class: "small", text: snap.rootName || "—" }),
        el("p", { class: "tiny muted", text: "Trust anchor. End-entity certificates are not issued here." })
      ));
      (snap.issuing || []).forEach(function (issuer) {
        const issued = certs.filter(function (cert) { return cert.issuerName === issuer.name; });
        hierarchy.append(el("div", { class: "cell" },
          el("p", { class: "tiny muted", text: "Issuing CA" }),
          el("p", { class: "small break", text: shortCa(issuer.name) }),
          el("p", { class: "tiny muted break", text: issuer.host || issuer.name }),
          el("p", { class: "tiny muted", text: issued.filter(function (cert) { return isValid(cert, now); }).length + " valid · " + issued.filter(function (cert) { return isValid(cert, now) && daysUntil(cert.notAfter, now) <= windowDays; }).length + " expiring" })
        ));
      });
      root.append(hierarchy);

      root.append(el("section", { class: "stats" },
        stat("Issued records", String(certs.length), ""),
        stat("Valid now", String(valid.length), "ok"),
        stat("Expiring in " + windowDays + " days", String(expiring.length), expiring.length ? "warn" : ""),
        stat("Clients not active", String(quiet), quiet ? "warn" : "")
      ));

      root.append(el("p", { class: "card banner small muted", text: "Client status is the collector’s last " + windowMinutes + " minute probe: active, inactive, not in DNS, or not on the network. Several clients may share one certificate. The dashboard does not resolve names and does not leave this network." }));

      const tabs = el("div", { class: "tabs", role: "tablist" });
      [["clients", "Clients " + rows.length], ["inventory", "Inventory"], ["expiring", "Expiring " + expiring.length]].forEach(function (item) {
        tabs.append(el("button", {
          class: "tab" + (state.tab === item[0] ? " on" : ""),
          type: "button",
          role: "tab",
          text: item[1],
          click: function () { state.tab = item[0]; render(); }
        }));
      });
      root.append(tabs);

      if (state.tab === "clients") root.append(renderClients(rows, windowMinutes));
      if (state.tab === "inventory") root.append(renderInventory(certs, now, windowDays));
      if (state.tab === "expiring") root.append(renderExpiring(expiring, now));
    }

    function stat(label, value, tone) {
      return el("article", { class: "card stat" },
        el("p", { class: "tiny muted", text: label }),
        el("b", { class: tone, text: value })
      );
    }

    function renderClients(rows, windowMinutes) {
      const needle = state.query.trim().toLowerCase();
      const visible = rows.filter(function (row) {
        if (state.filter !== "all" && row.status !== state.filter) return false;
        if (!needle) return true;
        return [row.client, row.cert.cn, row.cert.serial, row.cert.template, row.address || ""].join(" ").toLowerCase().indexOf(needle) >= 0;
      });
      const wrap = el("section", { class: "stack" });
      wrap.append(el("p", { class: "small muted", text: "Each block is one certificate serial, then a client taken from its CN or a SAN. Sharing a certificate is not a conflict." }));
      const filters = el("div", { class: "filters" });
      filters.append(el("input", {
        type: "search",
        placeholder: "Certificate, client, or serial",
        value: state.query,
        const start = event.target.selectionStart;
      state.query = event.target.value;
      render();
      const next = document.querySelector('input[type="search"]');
      if (next) {
        next.focus();
        if (start != null) next.setSelectionRange(start, start);
      }
      }));
      FILTERS.forEach(function (item) {
        filters.append(el("button", {
          class: "btn" + (state.filter === item ? " on" : ""),
          type: "button",
          text: item === "all" ? "All" : LABELS[item],
          click: function () { state.filter = item; render(); }
        }));
      });
      wrap.append(filters);
      if (!visible.length) wrap.append(el("p", { class: "small muted", text: "No clients match." }));
      const groups = [];
      const index = {};
      visible.forEach(function (row) {
        if (!index[row.cert.id]) {
          index[row.cert.id] = [];
          groups.push(index[row.cert.id]);
        }
        index[row.cert.id].push(row);
      });
      groups.forEach(function (group) {
        const cert = group[0].cert;
        const article = el("article", { class: "card group" },
          el("header", {},
            el("p", { class: "tiny mono muted break", text: formatSerial(cert.serial) }),
            el("h2", { text: cert.cn }),
            el("p", { class: "tiny muted", text: cert.template + " · " + shortCa(cert.issuerName) + " · expires " + formatWhen(cert.notAfter) })
          )
        );
        group.forEach(function (row) {
          const tone = row.status === "active" ? "active" : row.status === "not-checked" ? "muted" : "bad";
          article.append(el("div", { class: "client" },
            el("div", {},
              el("p", { class: "small break", text: row.client }),
              row.address ? el("p", { class: "tiny mono muted", text: row.address }) : null
            ),
            el("p", { class: "tiny muted", text: row.via === "cn" ? "CN" : "SAN" }),
            el("div", {},
              el("p", { class: "small " + tone, text: LABELS[row.status] || row.status }),
              el("p", { class: "tiny muted", text: row.checkedAt == null ? "No probe in this file" : row.fresh ? "Last " + windowMinutes + " min" : "Older than " + windowMinutes + " min" })
            )
          ));
        });
        wrap.append(article);
      });
      return wrap;
    }

    function renderInventory(certs, now, windowDays) {
      const list = el("section", { class: "stack" });
      certs.slice().sort(function (a, b) { return new Date(a.notAfter) - new Date(b.notAfter); }).forEach(function (cert) {
        const left = daysUntil(cert.notAfter, now);
        const status = cert.disposition === "revoked" ? "Revoked" : left <= 0 ? "Expired" : left <= windowDays ? "Expiring" : "Valid";
        list.append(el("article", { class: "card banner" },
          el("p", { class: "tiny mono muted break", text: formatSerial(cert.serial) }),
          el("h2", { text: cert.cn }),
          el("p", { class: "tiny muted", text: status + " · " + cert.template + " · " + shortCa(cert.issuerName) + " · " + formatWhen(cert.notAfter) })
        ));
      });
      if (!certs.length) list.append(el("p", { class: "small muted", text: "No certificates in this file." }));
      return list;
    }

    function renderExpiring(certs, now) {
      const list = el("section", { class: "stack" });
      if (!certs.length) list.append(el("p", { class: "small muted", text: "Nothing in the expiry window." }));
      certs.forEach(function (cert) {
        list.append(el("article", { class: "card banner" },
          el("p", { class: "small bad", text: daysUntil(cert.notAfter, now) + " days" }),
          el("h2", { text: cert.cn }),
          el("p", { class: "tiny muted", text: formatSerial(cert.serial) + " · " + shortCa(cert.issuerName) })
        ));
      });
      return list;
    }

    loadFile();
    setInterval(loadFile, 30000);
  </script>
</body>
</html>
